# The Python environment of the repository: uv, then every dependency group exactly as written
# in uv.lock (`--locked` fails when the lock file is out of date instead of changing it).
name: Python environment from uv.lock
description: Installs uv and the locked dependency groups of pyproject.toml.
inputs:
  python-version:
    description: Python version for uv.
    required: false
    default: "3.13"
  enable-cache:
    description: Cache of uv (`true`, `false` or `auto`); keep it off in jobs that hold secrets.
    required: false
    default: "auto"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: ${{ inputs.enable-cache }}
    - name: Locked dependency groups
      shell: bash
      run: uv sync --locked --all-groups
