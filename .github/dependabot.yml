# Weekly updates, minor and patch grouped into one pull request per ecosystem.
# .github/workflows/dependabot-auto-merge.yml enables auto-merge for grouped minor and patch
# updates of GitHub Actions and of the Python development tools, which merge once the required
# checks pass. Rust dependencies always wait for review. Policy: docs/en/project/dependencies.md.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule: { interval: weekly }
    commit-message: { prefix: "build", include: scope }
    groups: { cargo: { patterns: ["*"], update-types: [minor, patch] } }
  # The uv ecosystem updates pyproject.toml and uv.lock together.
  - package-ecosystem: uv
    directory: "/"
    schedule: { interval: weekly }
    commit-message: { prefix: "build", include: scope }
    groups: { python: { patterns: ["*"], update-types: [minor, patch] } }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    commit-message: { prefix: "ci", include: scope }
    groups: { actions: { patterns: ["*"], update-types: [minor, patch] } }
