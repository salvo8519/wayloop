name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: House style, translations and Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run python scripts/check_style.py
      - run: uv run typos
      - name: Translations current (or labelled translation-pending)
        if: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'translation-pending') }}
        run: uv run python scripts/i18n.py check
      - name: Process scripts tested
        run: uv run pytest tests/process
      - run: uv run python scripts/check_yaml.py
      - run: uv run python scripts/check_task_ids.py
      - name: Roadmap consistent (and with the pull request body)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
            uv run python scripts/roadmap.py check --pr-body "$RUNNER_TEMP/pr-body.md"
          else
            uv run python scripts/roadmap.py check
          fi
      - name: Sprint files valid
        run: for f in sprints/S*.yaml; do [ ! -e "$f" ] || uv run python scripts/sprint.py validate "$f" || exit 1; done
      - name: Sprint pull request stays in its lane
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'sprint/')
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=50 origin "$BASE_SHA"
          uv run python scripts/sprint.py check-diff --branch "$HEAD_REF" --base "$BASE_SHA"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
