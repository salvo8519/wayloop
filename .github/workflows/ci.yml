name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: House style, translations and Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0  # the docs impact check compares the branch with its base
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run python scripts/check_style.py
      - run: uv run typos
      - name: Translations current (or labelled translation-pending)
        if: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'translation-pending') }}
        run: uv run python scripts/i18n.py check
      - name: Python lint, error handling and format (ruff)
        run: |
          uv run ruff check --output-format github scripts tests .claude/hooks
          uv run ruff format --check scripts tests .claude/hooks
      - name: Python types (mypy strict)
        run: uv run mypy
      - name: Process scripts tested
        run: uv run pytest tests/process
      - name: Required checks reported on pull requests
        run: uv run python scripts/required_checks.py check
      - name: Agent mirrors generated from .agents
        run: uv run python scripts/sync_agents.py --check
      - name: Skills, agents and hooks follow the standard (ADR 0027)
        run: uv run python scripts/check_agents.py
      - name: ADRs, specifications and navigation agree
        run: uv run python scripts/docs_sync.py coverage
      - name: Public pages state no plans in prose
        run: uv run python scripts/docs_sync.py claims
      - name: Documentation updated with the changes (or labelled no-docs-needed)
        if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-docs-needed') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/docs_sync.py impact --base "origin/$BASE_REF"
      - name: Release note fragment for user-facing changes (or labelled no-release-note)
        if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-release-note') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qE '^(crates/[^/]+/src/|schemas/)'; then
            uv run towncrier check --compare-with "origin/$BASE_REF"
          else
            echo "No user-facing source changes."
          fi
      - run: uv run python scripts/check_yaml.py
      - run: uv run python scripts/check_task_ids.py
      - name: Roadmap consistent (and with the pull request body)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
            uv run python scripts/roadmap.py check --pr-body "$RUNNER_TEMP/pr-body.md"
          else
            uv run python scripts/roadmap.py check
          fi
      - name: Sprint files valid
        run: for f in sprints/S*.yaml; do [ ! -e "$f" ] || uv run python scripts/sprint.py validate "$f" || exit 1; done
      - name: Sprint pull request stays in its lane
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'sprint/')
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=50 origin "$BASE_SHA"
          uv run python scripts/sprint.py check-diff --branch "$HEAD_REF" --base "$BASE_SHA"
      - name: Pure crates perform no I/O (ADR 0001, ADR 0006)
        run: uv run python scripts/check_core_io.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  workflows:
    name: Quality · workflows, pins, unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      # Security audit of the workflows: injections, permissions, credentials, pins.
      - run: uvx zizmor@1.32.0 --offline --min-severity low .github/workflows
      # Workflow syntax, runner labels and shell scripts (shellcheck is on the runner).
      - run: uvx --from actionlint-py@1.7.12.25 actionlint
      - run: python3 scripts/pin_actions.py --check
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        id: machete-install
        continue-on-error: true
        timeout-minutes: 5
        with:
          tool: cargo-machete@0.9.2
          fallback: none
      - name: Build cargo-machete from crates.io (download failed)
        if: steps.machete-install.outcome == 'failure'
        run: cargo install --locked cargo-machete@0.9.2
      - run: cargo machete

  deny:
    name: Dependencies · licenses, bans, advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Pinned versions; if the download fails, the same version is built from crates.io.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        id: deny-install
        continue-on-error: true
        timeout-minutes: 5
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: Build cargo-deny from crates.io (download failed)
        if: steps.deny-install.outcome == 'failure'
        run: cargo install --locked cargo-deny@0.20.2
      - name: cargo deny check
        run: cargo deny --locked --all-features check
