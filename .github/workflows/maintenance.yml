name: Weekly maintenance

# Early warning, never blocking: tests against the newest compatible dependencies, build, tests
# and lints with the newest stable Rust (pull requests use the toolchain pinned in
# rust-toolchain.toml), security advisories, broken links, the required checks of the ruleset
# and mutation testing of wayloop-core. A failure opens (or updates) one issue labelled
# `maintenance`, with the surviving mutants and the new lints in its body; the next green run
# closes it (scripts/failure_issue.py).
# Policy: docs/en/project/dependencies.md.
on:
  schedule:
    - cron: "17 5 * * 1"   # Monday 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  latest-deps:
    name: Tests with the newest compatible dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Rust toolchain pinned in rust-toolchain.toml
        id: toolchain
        run: python3 -c 'import tomllib; print("channel=" + tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Upgrade lock files (not committed)
        run: |
          cargo update --verbose 2>&1 | tee cargo-update.txt
          uv lock --upgrade 2>&1 | tee uv-upgrade.txt
      - run: cargo test --workspace --locked
      - run: uv sync --all-groups && uv run pytest -q

  latest-toolchain:
    name: Build, tests and lints with the newest stable Rust
    runs-on: ubuntu-latest
    env:
      # Overrides rust-toolchain.toml: what the next bump of the pinned toolchain would meet.
      RUSTUP_TOOLCHAIN: stable
    outputs:
      findings: ${{ steps.result.outputs.findings }}
      version: ${{ steps.result.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - name: Clippy and tests with the newest stable (findings in the job output)
        id: result
        run: |
          status=0
          cargo clippy --workspace --all-targets --locked --message-format json -- -D warnings \
            > clippy.json || status=$?
          jq -r 'select(.reason == "compiler-message") | .message
            | select(.level == "error" or .level == "warning") | select(.spans | length > 0)
            | "\(.spans[0].file_name):\(.spans[0].line_start): \(.code.code // "error") \(.message)"' \
            clippy.json | sort -u > findings.txt
          cargo test --workspace --locked || status=$?
          {
            echo "### Newest stable Rust: $(rustc -V)"
            echo "Clippy findings: $(wc -l < findings.txt)."
            echo '```'
            cat findings.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          delimiter="findings-$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          {
            echo "version=$(rustc -V)"
            echo "findings<<$delimiter"
            cat findings.txt
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          exit "$status"

  audit:
    name: Security advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # cargo-deny 0.20.2: install-action downloads it with retries and checks its SHA-256.
      # If the download still fails (GitHub outage on release assets), the next step builds the
      # same version from crates.io with its published lockfile (#181).
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        id: deny-install
        continue-on-error: true
        timeout-minutes: 5
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - name: Build cargo-deny from crates.io (download failed)
        if: steps.deny-install.outcome == 'failure'
        run: cargo install --locked cargo-deny@0.20.2
      - name: cargo deny check advisories
        run: cargo deny --locked --all-features check advisories
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: pip-audit on the locked Python dependencies
        run: |
          uv export --frozen --all-groups --no-emit-project --no-hashes -o requirements.txt
          uvx pip-audit@2.10.1 --strict -r requirements.txt

  links:
    name: Links in documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --max-retries 3 --exclude-path docs/_shared/vendor './**/*.md'
          fail: true

  required-checks:
    name: Required checks match the ruleset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --with pyyaml python scripts/required_checks.py remote --repo "$GITHUB_REPOSITORY"

  mutants:
    name: Mutation testing of wayloop-core
    runs-on: ubuntu-latest
    # 13 mutants in about 15 seconds today; the timeout leaves room for a core a hundred times larger.
    timeout-minutes: 90
    outputs:
      missed: ${{ steps.result.outputs.missed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Rust toolchain pinned in rust-toolchain.toml
        id: toolchain
        run: python3 -c 'import tomllib; print("channel=" + tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        id: mutants-install
        continue-on-error: true
        timeout-minutes: 5
        with:
          tool: cargo-mutants@27.1.0
          fallback: none
      - name: Build cargo-mutants from crates.io (download failed)
        if: steps.mutants-install.outcome == 'failure'
        run: cargo install --locked cargo-mutants@27.1.0
      - name: cargo mutants on the pure crates (same command as just mutants)
        id: run
        run: |
          status=0
          cargo mutants --package wayloop-core --package wayloop-schemas --no-shuffle --output target/mutants || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Surviving mutants in the summary and in the job output
        id: result
        env:
          STATUS: ${{ steps.run.outputs.status }}
        run: |
          out=target/mutants/mutants.out
          cat "$out/missed.txt" "$out/timeout.txt" > survivors.txt 2>/dev/null || true
          {
            echo '### Mutation testing of wayloop-core'
            echo "Caught: $(wc -l < "$out/caught.txt"), surviving or timed out: $(wc -l < survivors.txt)."
            echo '```'
            cat survivors.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          delimiter="survivors-$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          { echo "missed<<$delimiter"; cat survivors.txt; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
          # 2: mutants survived, 3: a mutant timed out; anything else non-zero is a tool failure.
          exit "${STATUS:-1}"

  report:
    name: Open, update or close the maintenance issue
    needs: [latest-deps, latest-toolchain, audit, links, required-checks, mutants]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: >-
            latest-deps=${{ needs.latest-deps.result }},
            latest-toolchain=${{ needs.latest-toolchain.result }},
            audit=${{ needs.audit.result }},
            links=${{ needs.links.result }},
            required-checks=${{ needs.required-checks.result }},
            mutants=${{ needs.mutants.result }}
          MISSED: ${{ needs.mutants.outputs.missed }}
          RUST_FINDINGS: ${{ needs.latest-toolchain.outputs.findings }}
          RUST_LATEST: ${{ needs.latest-toolchain.outputs.version }}
        run: |
          case "$RESULTS" in
            *=failure*) conclusion=failure ;;
            *=cancelled*) conclusion=cancelled ;;
            *) conclusion=success ;;
          esac
          # Only the jobs that did not succeed go into the issue.
          jobs=$(printf '%s' "$RESULTS" | tr ',' '\n' | sed 's/^ *//' \
            | grep -v -E '^$|=(success|skipped)$' | paste -sd, -) || jobs=""
          {
            echo "Triage with the dependency policy (docs/en/project/dependencies.md)."
            if [ -n "$MISSED" ]; then
              echo
              echo "Surviving mutants of the pure crates (cargo-mutants): add a test that kills each one."
              echo '```'
              printf '%s\n' "$MISSED"
              echo '```'
            fi
            if [ -n "$RUST_FINDINGS" ]; then
              echo
              echo "Clippy findings with the newest stable Rust ($RUST_LATEST), not with the pinned"
              echo "toolchain: fix them in the pull request that bumps rust-toolchain.toml"
              echo "(docs/en/project/conventions.md, Code quality)."
              echo '```'
              printf '%s\n' "$RUST_FINDINGS"
              echo '```'
            fi
          } > details.md
          python3 scripts/failure_issue.py report --repo "$GITHUB_REPOSITORY" \
            --workflow "Weekly maintenance" --run-id "$GITHUB_RUN_ID" --run-url "$RUN_URL" \
            --conclusion "$conclusion" --event schedule --branch main --label maintenance \
            --title "Weekly maintenance report" --jobs "$jobs" --details details.md
