# Installed by `uv run pre-commit install --hook-type pre-commit --hook-type commit-msg`.
# Fast checks on each commit; the full gate is `uv run just check` (and CI).
default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: local
    hooks:
      # The formatters fix the staged files instead of only checking them: a commit with
      # unformatted code stops once, with the files already fixed; stage them and commit again.
      # CI runs the same tools in check mode.
      - id: cargo-fmt
        name: cargo fmt (applies the format)
        entry: cargo fmt --all
        language: system
        types: [rust]
        pass_filenames: false
      - id: ruff-check
        name: ruff check --fix (Python lint and error handling, safe fixes applied)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        files: ^(scripts|tests|\.claude/hooks)/
      - id: ruff-format
        name: ruff format (applies the format)
        entry: uv run ruff format
        language: system
        types: [python]
        files: ^(scripts|tests|\.claude/hooks)/
      - id: mypy
        name: mypy strict
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: typos
        name: typos
        entry: uv run typos
        language: system
        pass_filenames: false
      - id: house-style
        name: no icons or emoji
        entry: uv run python scripts/check_style.py
        language: system
        pass_filenames: false
      - id: i18n
        name: Italian translations current
        entry: uv run python scripts/i18n.py check
        language: system
        pass_filenames: false
      - id: roadmap
        name: roadmap consistent
        entry: uv run python scripts/roadmap.py check
        language: system
        pass_filenames: false
        files: ^(roadmap/|specs/)
      - id: pure-crates
        name: pure crates keep their allowlists and lints
        entry: python3 scripts/check_core_io.py
        language: system
        pass_filenames: false
        files: ^(crates/|Cargo\.(toml|lock)$|scripts/check_core_io\.py$)
      - id: agent-mirrors
        name: .claude mirrors generated from .agents
        entry: python3 scripts/sync_agents.py --check
        language: system
        pass_filenames: false
        files: ^(\.agents/(agents|skills)/|\.claude/(agents|skills)/)
      - id: agents-standard
        name: skills, agents and hooks follow ADR 0027
        entry: python3 scripts/check_agents.py
        language: system
        pass_filenames: false
        files: ^(\.agents/|\.claude/)
      - id: docs-coverage
        name: ADRs, specifications and navigation agree
        entry: python3 scripts/docs_sync.py coverage
        language: system
        pass_filenames: false
        files: ^(docs/en/|specs/|zensical\.toml)
      - id: docs-claims
        name: public pages state no plans in prose
        entry: python3 scripts/docs_sync.py claims
        language: system
        pass_filenames: false
        files: ^(README.*\.md|docs/(en|it)/|scripts/docs_sync\.py)
      - id: docs-impact
        name: documentation updated with the changes
        entry: python3 scripts/docs_sync.py impact --staged
        language: system
        stages: [commit-msg]
      - id: conventional-commit
        name: commit message follows docs/en/project/conventions.md
        entry: python3 scripts/conventions.py commit-msg
        language: system
        stages: [commit-msg]
