[workspace]
resolver = "3"
members = [
  "crates/wayloop-schemas",
  "crates/wayloop-core",
  "crates/wayloop-runtime",
  "crates/wayloop-cli",
  "crates/wayloop-schemagen",
]

# The single source of the project version. Everything else derives from it.
[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/salvo8519/wayloop"
homepage = "https://salvo8519.github.io/wayloop/"
authors = ["The Wayloop Authors"]

# Dependencies shared by several crates, declared once so that every crate gets the same
# features.
[workspace.dependencies]
# float_roundtrip: numbers are read as the nearest double, as every other JSON parser reads
# them; the default parser can be one unit in the last place off, and input_hash would then
# differ between channels (SPEC-0004 R15). It adds no crate. arbitrary_precision must stay off:
# the canonical JSON writes every number as a double (RFC 8785). Tests in
# crates/wayloop-core/src/canonical.rs fail if either changes.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Restriction lints: the engine never panics on bad input, every failure is a value
# (ADR 0009 C3, C7). Tests may unwrap, expect, panic and index: see clippy.toml.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
indexing_slicing = "warn"
panic_in_result_fn = "warn"
get_unwrap = "warn"
exit = "warn"
mem_forget = "warn"
string_slice = "warn"
# arithmetic_side_effects is left off: it flags every `+` on an index or a counter and would
# turn the code into checked arithmetic everywhere. Arithmetic on values read from input uses
# checked_* explicitly, and the specification that introduces such a value says so.
