[workspace]
resolver = "3"
members = [
  "crates/wayloop-schemas",
  "crates/wayloop-core",
  "crates/wayloop-runtime",
  "crates/wayloop-cli",
]

# The single source of the project version. Everything else derives from it.
[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/salvo8519/wayloop"
homepage = "https://salvo8519.github.io/wayloop/"
authors = ["The Wayloop Authors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
