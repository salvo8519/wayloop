[package]
name = "wayloop-core"
description = "Deterministic engine of Wayloop: artifact model, state machine and ledger. No I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
# The version follows the workspace version; crates.io requires it on a path dependency.
wayloop-schemas = { path = "../wayloop-schemas", version = "0.0.0" }
# With float_roundtrip, from the workspace manifest.
serde_json.workspace = true
# The traits of serde, for the parser that refuses repeated keys (SPEC-0001 plan); on the
# allowlist of the core, reached through serde_json and wayloop-schemas.
serde = { version = "1.0.229", default-features = false }

# Tests only: never shipped, so not on the allowlist of scripts/check_core_io.py.
[dev-dependencies]
# The valid documents of the examples of SPEC-0001, for the tests.
wayloop-schemas = { path = "../wayloop-schemas", version = "0.0.0", features = ["examples"] }
# Test-only oracle for the hand-written SHA-256 (SPEC-0001 plan, D3); never shipped.
sha2 = { version = "0.11.0", default-features = false }
# Oracle of the schema interpreter (SPEC-0001 plan, D5): it must agree on every verdict.
# Without default features it resolves no remote or file reference and needs no TLS.
jsonschema = { version = "0.61.2", default-features = false }
# Independent checks of the named formats in the oracle.
regex = "1.11"
# Test types that break one rule of the subset each, for the tests of contract_schema.
schemars = { version = "1.2.3", default-features = false, features = ["derive", "std"] }
# Property tests of one-pass reporting and of the fixes of formats.
proptest = { version = "1", default-features = false, features = ["std"] }

[lints]
workspace = true
