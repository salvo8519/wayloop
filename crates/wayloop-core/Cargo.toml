[package]
name = "wayloop-core"
description = "Deterministic engine of Wayloop: artifact model, state machine and ledger. No I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
# The version follows the workspace version; crates.io requires it on a path dependency.
wayloop-schemas = { path = "../wayloop-schemas", version = "0.0.0" }
# float_roundtrip: numbers are parsed to the nearest double, as every other JSON parser does;
# the default parser can be one unit in the last place off, and input_hash would then differ
# between channels (SPEC-0004 R15). It adds no crate.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[dev-dependencies]
# Test-only oracle for the hand-written SHA-256 (SPEC-0001 plan, D3); never shipped.
sha2 = { version = "0.11.0", default-features = false }

[lints]
workspace = true
