# cargo-deny: licenses, bans and advisories of the Rust dependencies.
# The rule that wayloop-core has no I/O dependency is checked by scripts/check_core_io.py.
[licenses]
allow = ["Apache-2.0", "MIT", "MIT-0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "Apache-2.0 WITH LLVM-exception"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
