# Development tooling of the repository (documentation, checks, release notes).
# The Python SDK arrives in milestone M4 as its own package; this file ships nothing to users.
[project]
name = "wayloop-dev"
version = "0.0.0"
description = "Development tooling of Wayloop. Not published."
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pyyaml>=6",
  "pytest>=8",
  "tomli-w>=1.0",
  "ruff>=0.17,<0.18",
  "rust-just>=1.40",
  "typos>=1.30",
  "pre-commit>=4",
  "git-cliff>=2.6",
  "towncrier>=24.8",
  "mypy>=1.13",
  "types-pyyaml>=6",
  "pytest-cov>=7",
]
docs = [
  "zensical>=0.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Errors and style (E, W), mistakes (F, B), imports (I), modern syntax (UP), simpler code (SIM),
# ruff's own checks (RUF), and error handling: no blind except (BLE), exceptions raised and
# caught with care (TRY), no silent try-except-pass (S110), explicit encoding (PLW1514).
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "BLE", "TRY", "S110", "PLW1514"]
# PLW1514 is a preview rule in ruff. `preview` also turns on the preview behaviour of the
# stable rules selected above; explicit-preview-rules keeps every other preview rule off unless
# it is selected by its exact code. ruff is pinned to a minor range so that a lock refresh
# cannot change the rules without a review.
preview = true
explicit-preview-rules = true

[tool.mypy]
strict = true
python_version = "3.12"
files = ["scripts", "tests/process", ".claude/hooks"]
# Every file is a standalone script, not a package: the same base name may not appear twice.
explicit_package_bases = true
# The scripts import each other by module name (`from conventions import BRANCH`), as Python
# does when it runs `python scripts/<name>.py`.
mypy_path = "scripts"

[[tool.mypy.overrides]]
# fontTools ships no type information; scripts/brand.py is run by hand, with the fonts.
module = ["fontTools.*"]
ignore_missing_imports = true

[tool.towncrier]
name = "Wayloop"
directory = "changes"
filename = "RELEASE_NOTES.md"
start_string = "<!-- release notes start -->\n"
title_format = "## Wayloop {version} — {project_date}"
issue_format = "[#{issue}](https://github.com/salvo8519/wayloop/issues/{issue})"
underlines = ["", "", ""]
wrap = false

[[tool.towncrier.type]]
directory = "breaking"
name = "Action required"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "New"
showcontent = true

[[tool.towncrier.type]]
directory = "improvement"
name = "Improved"
showcontent = true

[[tool.towncrier.type]]
directory = "fix"
name = "Fixed"
showcontent = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Scripts import each other by module name, as `python scripts/<name>.py` allows.
pythonpath = ["scripts"]
addopts = "-q"
