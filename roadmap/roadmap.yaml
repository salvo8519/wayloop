  - { name: "epic", color: "0B1F3A" }
  - { name: "task", color: "5319e7" }
  - { name: "bug", color: "d73a4a" }
  - { name: "spec-request", color: "0F766E" }
  - { name: "maintenance", color: "5319e7" }
  - { name: "no-docs-needed", color: "cfd3d7" }
