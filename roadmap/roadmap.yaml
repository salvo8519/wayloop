  - { name: "parallel", color: "c2e0c6" }
  - { name: "good first issue", color: "7057ff" }
  - { name: "translation-pending", color: "fbca04" }
  - { name: "no-release-note", color: "cfd3d7" }
  - { name: "spec", color: "0F766E" }
  - { name: "adr", color: "12325C" }
  - { name: "area:tracker", color: "1d76db" }
  - { name: "area:survey", color: "1d76db" }
