    "concepts/state-in-the-tracker.md",
    "concepts/gates.md",
    "concepts/ledger.md",
    "concepts/brownfield-survey.md",
    "concepts/architecture.md",
  ] },
  { "Reference" = [
    "reference/index.md",
  ] },
  { "Project" = [
    "project/vision.md",
    "project/brand.md",
    "project/roadmap.md",
    "project/release-notes.md",
    "project/changelog.md",
    "project/contributing.md",
    "project/conventions.md",
    "project/dependencies.md",
    { "Decisions (ADR)" = [
