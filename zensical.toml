[project]
site_name = "Wayloop"
site_description = "Spec-driven agentic loop. From idea to merged code, in your issues, with humans at the gates."
site_url = "https://salvo8519.github.io/wayloop/"
docs_dir = "docs/en"
site_dir = "site"
repo_url = "https://github.com/salvo8519/wayloop"
repo_name = "salvo8519/wayloop"
edit_uri = "edit/main/docs/en/"
copyright = "Copyright &copy; 2026 The Wayloop Authors &middot; Apache License 2.0"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "getting-started/index.md",
  ] },
  { "Guides" = [
    "guides/index.md",
  ] },
  { "Concepts" = [
